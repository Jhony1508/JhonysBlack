  <!-- ================= LOGIN ================= -->

  <main class="auth-page">

    <section class="auth-box">

      <div class="auth-header">

        <p class="auth-label">
          JHONYSBLACK
        </p>

        <h1>
          INICIAR SESIÓN
        </h1>

        <p>
          WELCOME BACK TO THE BLACK
        </p>

      </div>


      <form id="loginForm">


        <!-- EMAIL -->

        <div class="form-group">

          <label for="loginEmail">
            EMAIL
          </label>

          <input
            type="email"
            id="loginEmail"
            name="email"
            placeholder="tu@email.com"
            required
          >

        </div>


        <!-- CONTRASEÑA -->

        <div class="form-group">

          <label for="loginPassword">
            CONTRASEÑA
          </label>

          <input
            type="password"
            id="loginPassword"
            name="password"
            placeholder="••••••••"
            required
          >

        </div>


        <!-- RECORDAR -->

        <label class="checkbox-group">

          <input
            type="checkbox"
            id="remember"
          >

          <span>
            Recordar mi sesión
          </span>

        </label>


        <!-- BOTÓN -->

        <button
          type="submit"
          class="btn auth-button"
        >
          INICIAR SESIÓN
        </button>


        <!-- MENSAJE -->

        <p
          id="loginMessage"
          class="auth-message"
        ></p>


      </form>


      <!-- RECUPERAR CONTRASEÑA -->

      <div class="auth-links">

        <a href="#" onclick="forgotPassword(event)">
          ¿OLVIDASTE TU CONTRASEÑA?
        </a>

      </div>


      <!-- REGISTRO -->

      <div class="auth-footer">

        <p>
          ¿NO TIENES UNA CUENTA?
        </p>

        <a href="registro.html">
          CREAR CUENTA
        </a>

      </div>

    </section>
