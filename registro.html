  <!-- ================= REGISTRO ================= -->

  <main class="auth-page">

    <section class="auth-box">

      <div class="auth-header">

        <p class="auth-label">
          JHONYSBLACK
        </p>

        <h1>
          CREAR CUENTA
        </h1>

        <p>
          ÚNETE A LA BLACK COMMUNITY
        </p>

      </div>


      <form id="registerForm">


        <!-- NOMBRE -->

        <div class="form-group">

          <label for="registerName">
            NOMBRE
          </label>

          <input
            type="text"
            id="registerName"
            name="name"
            placeholder="Tu nombre"
            required
          >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="registerEmail">
            EMAIL
          </label>

          <input
            type="email"
            id="registerEmail"
            name="email"
            placeholder="tu@email.com"
            required
          >

        </div>


        <!-- CONTRASEÑA -->

        <div class="form-group">

          <label for="registerPassword">
            CONTRASEÑA
          </label>

          <input
            type="password"
            id="registerPassword"
            name="password"
            placeholder="••••••••"
            minlength="6"
            required
          >

        </div>


        <!-- REPETIR CONTRASEÑA -->

        <div class="form-group">

          <label for="registerPasswordConfirm">
            REPETIR CONTRASEÑA
          </label>

          <input
            type="password"
            id="registerPasswordConfirm"
            name="passwordConfirm"
            placeholder="••••••••"
            minlength="6"
            required
          >

        </div>


        <!-- CONDICIONES -->

        <label class="checkbox-group">

          <input
            type="checkbox"
            id="terms"
            required
          >

          <span>
            Acepto los términos y condiciones de la tienda.
          </span>

        </label>


        <!-- BOTÓN -->

        <button
          type="submit"
          class="btn auth-button"
        >
          CREAR CUENTA
        </button>


        <!-- MENSAJE -->

        <p
          id="registerMessage"
          class="auth-message"
        ></p>


      </form>


      <div class="auth-footer">

        <p>
          ¿YA TIENES UNA CUENTA?
        </p>

        <a href="login.html">
          INICIAR SESIÓN
        </a>

      </div>
